# mudauth -- nginx reverse proxy for the public /auth/ path.
#
# nginx terminates TLS (certbot) and proxies the browser-facing OAuth endpoints
# to the loopback mudauth listener. The MUD itself never accepts inbound HTTP;
# only nginx -> 127.0.0.1:7700 does.
#
# Add this location block inside the HTTPS `server { }` block that serves
# mud.example (the same block certbot manages). It makes
# https://mud.example/auth/* reach mudauth, which is exactly the value of
# AUTH_PUBLIC_BASE in the service's .env.
#
# A matching rate-limit zone (defined once at http{} scope):
#   limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

location /auth/ {
    limit_req zone=auth burst=20 nodelay;

    # The request line carries live credentials for their 10-minute lifetime:
    # the login_nonce in /auth/login/<provider>/<nonce>, ?code= and ?nonce=,
    # and Steam's signed assertion. The service redacts them from its own log;
    # nginx's access_log would record them in full, so it is off here.
    access_log off;

    # No trailing slash on proxy_pass: the /auth/ prefix is preserved, so
    # /auth/login and /auth/callback map straight through to the service.
    proxy_pass http://127.0.0.1:7700;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Strip whatever a client sent in this header before proxying: the
    # loopback exemption's token check requires no forwarding header on the
    # request, but the service still trusts THIS header at face value from a
    # loopback peer. Passing a client-supplied value through would let anyone
    # who has learned AUTH_SERVICE_TOKEN present it via this proxy and
    # inherit the game's exemption remotely. Blank clears it; nginx does not
    # merge repeated proxy_set_header lines for the same name, so this line
    # alone is the whole value the service receives, even if the client sent
    # one.
    proxy_set_header X-Auth-Service-Token "";

    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}
