# mudauth -- nginx reverse proxy for the public /auth/ path.
#
# nginx terminates TLS (certbot) and proxies the browser-facing OAuth endpoints
# to the loopback mudauth listener. The MUD itself never accepts inbound HTTP;
# only nginx -> 127.0.0.1:7700 does.
#
# Add this location block inside the HTTPS `server { }` block that serves
# mud.example (the same block certbot manages). It makes
# https://mud.example/auth/* reach mudauth, which is exactly the value of
# AUTH_PUBLIC_BASE in the service's .env.
#
# A matching rate-limit zone (defined once at http{} scope):
#   limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

location /auth/ {
    limit_req zone=auth burst=20 nodelay;

    # No trailing slash on proxy_pass: the /auth/ prefix is preserved, so
    # /auth/login and /auth/callback map straight through to the service.
    proxy_pass http://127.0.0.1:7700;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}
