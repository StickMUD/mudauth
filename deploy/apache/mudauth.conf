# mudauth -- Apache 2.4 reverse proxy for the public /auth/ path.
#
# Apache equivalent of deploy/nginx/mudauth.conf, for servers that use Apache
# (certbot --apache) instead of nginx. Apache terminates TLS and proxies the
# browser-facing OAuth endpoints to the loopback mudauth listener. The MUD
# itself never accepts inbound HTTP; only Apache -> 127.0.0.1:7700 does.
#
# These directives go INSIDE the HTTPS <VirtualHost *:443> that serves your MUD
# domain -- the block certbot manages, e.g.
#   /etc/apache2/sites-available/<domain>-le-ssl.conf
# Find it with:  sudo apache2ctl -S
# This file is a reference snippet; do NOT `Include` it as its own vhost.
#
# Enable the proxy modules once:
#   sudo a2enmod proxy proxy_http headers
#   sudo systemctl reload apache2
#
# After editing the vhost, validate and reload:
#   sudo apache2ctl configtest && sudo systemctl reload apache2

# Forward the original Host and mark the scheme as HTTPS for the backend.
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"

# https://<host>/auth/* -> 127.0.0.1:7700/auth/* (prefix preserved).
# The game builds <AUTH_PUBLIC_BASE>/auth/login/... so the host-root public base
# (AUTH_PUBLIC_BASE = "https://mud.example") lands on the service's own /auth/*
# routes here.
ProxyPass        /auth/ http://127.0.0.1:7700/auth/
ProxyPassReverse /auth/ http://127.0.0.1:7700/auth/

# --- Notes ------------------------------------------------------------------
#
# Canonical host: if the vhost redirects bare <domain> -> www.<domain> (or the
# reverse), register the OAuth callback on the CANONICAL host and use that same
# host in AUTH_PUBLIC_BASE / AUTH_CALLBACK_URL and in each provider's redirect
# URI, so the provider redirect lands with no extra 301 hop and the redirect_uri
# matches exactly.
#
# Rate limiting: the nginx config uses `limit_req`; Apache has no built-in
# equivalent. Add mod_evasive or mod_qos if you want one. It is optional -- the
# service already enforces per-flow CSRF `state`, single-use nonces with a
# 10-minute TTL, and origin-IP binding, so this is defense in depth.
#
# Firewall: nothing new here. Callbacks ride :443 (this vhost); mudauth listens
# on loopback only (127.0.0.1:7700) and is never exposed. Only the game's
# telnet/TLS ports need firewall rules.
#
# A second instance: if you run a staging service on another port, add a second
# pair of ProxyPass directives for it and set that instance's AUTH_PUBLIC_BASE
# to the prefix you proxy it at. Mind the prefix arithmetic -- mudauth always
# serves its routes under /auth/, so a public base of "https://<host>/staging"
# must reach the service at /staging/auth/*, which means mapping /staging/ to
# the service ROOT, not to its /auth/.
