[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mudauth"
dynamic = ["version"]
description = "Stateless OAuth/OIDC sign-in broker for MUDs implementing the GMCP Authentication standard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "StickMUD Entertainment, LLC", email = "support@stickmud.com" }]
keywords = ["mud", "gmcp", "oauth", "oidc", "mudlet", "ldmud", "telnet"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: No Input/Output (Daemon)",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment :: Multi-User Dungeons (MUD)",
  "Topic :: System :: Systems Administration :: Authentication/Directory",
]
dependencies = []

[project.optional-dependencies]
apple = ["PyJWT[crypto]>=2"]
ldmud = []
dev = ["ruff>=0.6", "build", "twine"]

[project.urls]
Homepage = "https://github.com/StickMUD/mudauth"
Documentation = "https://github.com/StickMUD/mudauth/tree/main/docs"
Issues = "https://github.com/StickMUD/mudauth/issues"
Standard = "https://wiki.mudlet.org/w/Standards:GMCP_Authentication"

[project.scripts]
mudauth = "mudauth.cli:main"

[project.entry-points.ldmud_efun]
auth_service_request = "mudauth.ldmud:auth_service_request"

[tool.setuptools.dynamic]
version = { attr = "mudauth.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
